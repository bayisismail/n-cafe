services:
  - type: web
    name: n-cafe
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATOR_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: n-cafe-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
databases:
  - name: n-cafe-db
    databaseName: n_cafe
    user: n_cafe
